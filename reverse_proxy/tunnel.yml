server:
  # Elastic IP behind this name (18.227.51.47). Use the name, not the raw
  # address: the box previously ran on an auto-assigned public IP, which
  # changed on restart and was recycled to another AWS tenant.
  REMOTE_HOST: proxy.web3db.org
  REMOTE_USER: ubuntu

# No nginx section on purpose. The proxy's vhosts and the :443 stream
# config (streams-enabled/fs-split.conf, which forwards fs-api still
# encrypted to the SGX enclave) are hand-maintained. Letting this container
# generate a vhost would add a second "listen 80; server_name
# proxy.web3db.org" and shadow the real one. Tunnels only.

tunnels:
  web3db-backend:
    local_port: 8000
    remote_port: 8000
    client_max_body_size: 5000M

  web3db-fs-backend:
    local_port: 8090
    remote_port: 8090
    client_max_body_size: 5000M

  # Note: config for another project
  nasa_project:
    local_port: 8001
    remote_port: 8001
