server:
  REMOTE_HOST: ec2-3-144-34-23.us-east-2.compute.amazonaws.com
  REMOTE_USER: ubuntu

nginx:
  site_config_file_name: reverse_proxy
  server_name: proxy.web3db.org

tunnels:
  web3db-backend:
    local_port: 8000
    remote_port: 8000
    client_max_body_size: 100M

  web3db-fs-backend:
    local_port: 8090
    remote_port: 8090
    client_max_body_size: 100M

  # Note: config for another project
  nasa_project:
    local_port: 8001
    remote_port: 8001